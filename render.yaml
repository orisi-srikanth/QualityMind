services:
  - type: web
    name: qualitymind-backend
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head && python -m app.db.seed"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: none
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qualitymind-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://qualitymind.vercel.app,http://localhost:5173,http://localhost:3000"

databases:
  - name: qualitymind-postgres
    region: oregon
    plan: free
    databaseName: qualitymind
    user: qualitymind_user
